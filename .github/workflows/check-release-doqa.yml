name: Check Doqa

on:
  pull_request:
    paths:
        - "Migrators/DoqaExporter/**"
env:
  DOQA_DIR: ./Migrators/DoqaExporter

jobs:
               
  doqa_build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: win-x64
            artifact_name: DoqaExporter.exe
            asset_name: DoqaExporter-win-x64-TEST.exe
          - os: linux-x64
            artifact_name: DoqaExporter
            asset_name: DoqaExporter-linux-x64-TEST
          # - os: osx-x64
          #   artifact_name: DoqaExporter
          #   asset_name: DoqaExporter-osx-x64-TEST
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
        
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8
        
      - name: Restore dependencies
        run: dotnet restore ${{ env.DOQA_DIR }}
        
      - name: Publish project
        run: |
          dotnet publish \
          -r ${{ matrix.os }} \
          --configuration Release \
          --self-contained true \
          --output ./publish \
          --no-restore ${{ env.DOQA_DIR }} 
